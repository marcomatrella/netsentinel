[project]
name = "netsentinel"
version = "1.2.1"
description = "Self-hosted network monitoring with topological correlation and root-cause analysis"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Marco Matrella", email = "marco.matrella.91@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=3.0.1",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "argon2-cffi>=23.1.0",
    "cryptography>=42.0.0",
    "fastapi>=0.110.0",
    "greenlet>=3.5.6",
    "httpx>=0.27.0",
    "jinja2>=3.1.3",
    "networkx>=3.2.0",
    "prometheus-client>=0.20.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.1",
    "speedtest-cli>=2.1.3",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.29.0",
]

[project.scripts]
netsentinel = "netsentinel:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "types-pyyaml>=6.0.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
mypy_path = "backend"

