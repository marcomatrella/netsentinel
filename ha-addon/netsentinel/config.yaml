name: "NetSentinel"
description: "Piattaforma di monitoraggio e Root Cause Analysis per LAN e HomeLab"
version: "1.1.1"
slug: "netsentinel"
init: false
arch:
  - aarch64
  - amd64
startup: application
boot: auto
host_network: true
ingress: false
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: Web Interface & API
webui: "http://[HOST]:[PORT:8080]"
map:
  - share:rw
  - config:rw
schema:
  subnet: str?
  auth_enabled: bool?
  timezone: str?
options:
  subnet: ""
  auth_enabled: false
  timezone: "Europe/Rome"
environment:
  NETSENTINEL_DATA_DIR: "/data"
  NETSENTINEL_PORT: "8080"
privileged:
  - NET_ADMIN
  - NET_RAW
apparmor: false
