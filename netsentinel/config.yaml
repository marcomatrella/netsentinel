name: "NetSentinel"
description: "Topology-aware network monitoring and Root Cause Analysis for LAN and HomeLab"
version: "1.1.3"
slug: "netsentinel"
init: false
arch:
  - aarch64
  - amd64
startup: application
boot: auto
host_network: true
ingress: true
ingress_port: 8080
panel_icon: mdi:shield-network-outline
panel_title: NetSentinel
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: Web Interface & API (optional if accessing via Ingress)
webui: "http://[HOST]:[PORT:8080]"
map:
  - share:rw
  - config:rw
schema:
  port: port?
  subnet: str?
  auth_enabled: bool?
  timezone: str?
options:
  port: 8080
  subnet: ""
  auth_enabled: false
  timezone: "Europe/Rome"
environment:
  NETSENTINEL_DATA_DIR: "/data"
privileged:
  - NET_ADMIN
  - NET_RAW
apparmor: false
