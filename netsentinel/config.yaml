name: "NetSentinel"
description: "Topology-aware network monitoring and Root Cause Analysis for LAN and HomeLab"
version: "1.1.5"
slug: "netsentinel"
init: false
arch:
  - aarch64
  - amd64
startup: application
boot: auto
host_network: true
ingress: true
ingress_port: 8181
panel_icon: mdi:shield-check
panel_title: NetSentinel
ports:
  8181/tcp: 8181
ports_description:
  8181/tcp: Web Interface & API (optional if accessing via Ingress)
webui: "http://[HOST]:[PORT:8181]"
schema:
  port: port?
  subnet: str?
  auth_enabled: bool?
  timezone: str?
options:
  port: 8181
  subnet: ""
  auth_enabled: false
  timezone: "Europe/Rome"
environment:
  NETSENTINEL_DATA_DIR: "/data"
privileged:
  - NET_ADMIN
  - NET_RAW

