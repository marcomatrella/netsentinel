services:
  netsentinel:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/marcomatrella/netsentinel:latest
    container_name: netsentinel
    restart: unless-stopped

    # Per macOS / Docker Desktop locale: usa mapping porte e cap_add
    # Per Linux / NAS (Synology, TrueNAS, unRAID): decommenta network_mode: host per discovery L2
    ports:
      - "8080:8080"
    cap_add:
      - NET_RAW  # Per ping ICMP diretti senza root

    # network_mode: host  # Consigliato su Linux / NAS per discovery broadcast

    volumes:
      - ./data:/data

    environment:
      - TZ=Europe/Rome
      - NETSENTINEL_DATA_DIR=/data
      - NETSENTINEL_PORT=8080
      - NETSENTINEL_SECRET_KEY=  # Optional: provide a 32-byte Fernet key or let NetSentinel generate one
      # - NETSENTINEL_HEARTBEAT_URL=https://hc-ping.com/your-uuid-here

    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

