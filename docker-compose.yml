services:
  netsentinel:
    build:
      context: .
      dockerfile: Dockerfile
    image: netsentinel:latest
    container_name: netsentinel
    restart: unless-stopped

    # --------------------------------------------------------------------------
    # Networking Mode Configuration:
    # --------------------------------------------------------------------------
    # Option 1: Remote Production (Linux Server, Synology DSM, TrueNAS, unRAID)
    # [RECOMMENDED]: Attaches directly to the host's physical network stack.
    # Enables full L2/ARP discovery, zero-NAT latency, and raw ICMP ping.
    # Note: When 'network_mode: host' is active, DO NOT publish 'ports' (it binds to host:8080).
    #
    # network_mode: host
    # --------------------------------------------------------------------------
    # Option 2: Local Development (macOS / Windows via Docker Desktop)
    # Required on Mac/Windows because Docker runs in a VM without native host LAN access.
    # Comment out 'ports' if deploying on Linux/NAS with 'network_mode: host'.
    ports:
      - "8080:8080"

    # Required in BOTH modes: grants non-root container user permission for raw ICMP ping
    cap_add:
      - NET_RAW

    volumes:
      - ./data:/data

    environment:
      - TZ=Europe/Rome
      - NETSENTINEL_DATA_DIR=/data
      - NETSENTINEL_PORT=8080
      - NETSENTINEL_SECRET_KEY=  # Optional: provide a 32-byte Fernet key or let NetSentinel generate one
      # - NETSENTINEL_HEARTBEAT_URL=https://hc-ping.com/your-uuid-here

    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

