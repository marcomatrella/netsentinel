services:
  netsentinel:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/marcomatrella/netsentinel:latest
    container_name: netsentinel
    restart: unless-stopped

    # Host network mode is recommended for LAN discovery, ICMP, and broadcast traffic
    network_mode: host

    # Alternative bridge network mode (uncomment if network_mode: host is not desired):
    # ports:
    #   - "8080:8080"
    # cap_add:
    #   - NET_RAW

    volumes:
      - ./data:/data
      - /etc/localtime:/etc/localtime:ro

    environment:
      - TZ=Europe/Rome
      - NETSENTINEL_DATA_DIR=/data
      - NETSENTINEL_PORT=8080
      - NETSENTINEL_SECRET_KEY=  # Optional: provide a 32-byte Fernet key or let NetSentinel generate one
      # - NETSENTINEL_HEARTBEAT_URL=https://hc-ping.com/your-uuid-here

    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
